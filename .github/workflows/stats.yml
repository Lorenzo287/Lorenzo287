name: Update Language Stats Bar

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch:     # Allows you to run it manually anytime

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Gives the runner permission to save the image to your repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Top Languages SVG
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          # Change layout=compact to default if you prefer a solid block chart
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "layout": "compact",
              "card_width": 810,
              "hide_title": true,
              "hide_border": true,
              "bg_color": "00000000",
              "title_color": "58a6ff",
              "text_color": "c9d1d9",
              "langs_count": 6,
              "hide": "Tree-sitter Query,tree-sitter query,Tree-sitter"
            }
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "charts: update top languages bar" || exit 0
          git push
